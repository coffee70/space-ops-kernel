unit_id: platform-api-gateway
display_name: Platform API Gateway
package_owner: space-ops-platform
unit_kind: service
runtime_template: python-service
source_path: project/space-ops-platform
build:
  command: pip install -r requirements.txt
run:
  command: sh -c "cd /app/platform/backend && uvicorn main:app --app-dir services/platform-api-gateway --host 0.0.0.0 --port 8080"
health:
  type: http
  path: /health
  port: 8080
discovery:
  service_slug: platform-api-gateway
  category: platform
  api_base_path: /
  capability_tags:
    - gateway
    - public-api
  health_endpoint: /health
  visibility: public
  depends_on:
    - vehicle-config-service
    - source-registry-service
    - simulator-control-service
    - position-orbit-service
    - telemetry-query-service
    - ops-events-service
    - telemetry-intelligence-service
    - telemetry-ingest-service
