unit_id: telemetry-ingest-service
display_name: Telemetry Ingest Service
package_owner: space-ops-platform
runtime_kind: service
runtime_template: python-service
source_path: project/space-ops-platform
build:
  command: pip install -r requirements.txt
run:
  command: sh -c "cd /app/platform/backend && uvicorn main:app --app-dir services/telemetry-ingest-service
    --host 0.0.0.0 --port 8080"
health:
  type: http
  path: /health
  port: 8080
dependencies:
  - source-registry-service
discovery:
  service_slug: telemetry-ingest-service
  category: telemetry
  api_base_path: /telemetry/realtime
  capability_tags:
    - ingest
    - realtime
    - feed-health
  health_endpoint: /health
  visibility: internal
