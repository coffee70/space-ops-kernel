unit_id: model-config-service
display_name: Model Config Service
package_owner: space-ops-platform
runtime_kind: service
runtime_template: python-service
source_path: project/space-ops-platform
build:
  command: pip install -r requirements.txt
run:
  command: sh -c "cd /app/platform/backend && uvicorn main:app --app-dir services/model-config-service --host 0.0.0.0 --port 8080"
health:
  type: http
  path: /health
  port: 8080
mounts:
  - source: space-ops-kernel/runtime/model-registry
    target: /app/shared-model-registry
    read_only: false
discovery:
  service_slug: model-config-service
  category: intelligence
  api_base_path: /model-config
  capability_tags:
    - model-configuration
    - model-registry-config
  health_endpoint: /health
  visibility: internal
  depends_on:
    - agent-runtime-service
