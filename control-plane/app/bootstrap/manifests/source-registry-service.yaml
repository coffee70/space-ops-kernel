unit_id: source-registry-service
display_name: Source Registry Service
package_owner: space-ops-platform
runtime_kind: service
runtime_template: python-service
source_path: project/space-ops-platform
build:
  command: pip install -r requirements.txt
run:
  command: sh -c "cd /app/platform/backend && uvicorn main:app --app-dir services/source-registry-service --host 0.0.0.0 --port 8080"
health:
  type: http
  path: /health
  port: 8080
discovery:
  service_slug: source-registry-service
  category: telemetry
  api_base_path: /telemetry/sources
  capability_tags:
    - sources
    - streams
    - observations
  health_endpoint: /health
  visibility: internal
  depends_on:
    - vehicle-config-service
