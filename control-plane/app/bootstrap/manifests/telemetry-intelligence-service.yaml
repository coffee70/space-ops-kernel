unit_id: telemetry-intelligence-service
display_name: Telemetry Intelligence Service
package_owner: space-ops-platform
unit_kind: service
runtime_template: python-service
source_path: project/space-ops-platform
build:
  command: pip install -r requirements.txt
run:
  command: sh -c "cd /app/platform/backend && uvicorn main:app --app-dir services/telemetry-intelligence-service --host 0.0.0.0 --port 8080"
health:
  type: http
  path: /health
  port: 8080
discovery:
  service_slug: telemetry-intelligence-service
  category: telemetry
  api_base_path: /telemetry
  capability_tags:
    - search
    - llm
    - embeddings
  health_endpoint: /health
  visibility: internal
  depends_on:
    - source-registry-service
    - telemetry-query-service
