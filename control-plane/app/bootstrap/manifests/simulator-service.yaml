unit_id: simulator-service
display_name: Telemetry Simulator Service
package_owner: space-ops-platform
runtime_kind: service
runtime_template: python-service
source_path: project/space-ops-platform
build:
  command: pip install -r requirements.txt
run:
  command: sh -c "cd /app/platform/backend && uvicorn main:app --app-dir services/simulator-service --host 0.0.0.0 --port 8080"
health:
  type: http
  path: /health
  port: 8080
discovery:
  service_slug: simulator-service
  category: telemetry-provider
  api_base_path: /simulator
  capability_tags:
    - simulator
    - telemetry-provider
    - telemetry-ingest
    - scenario-streaming
    - realtime
  health_endpoint: /health
  visibility: internal
  depends_on:
    - source-registry-service
    - telemetry-ingest-service
