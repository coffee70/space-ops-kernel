unit_id: vehicle-config-service
display_name: Vehicle Config Service
package_owner: space-ops-platform
runtime_kind: service
runtime_template: python-service
source_path: project/space-ops-platform
build:
  command: pip install -r requirements.txt
run:
  command: sh -c "cd /app/platform/backend && uvicorn main:app --app-dir services/vehicle-config-service --host 0.0.0.0 --port 8080"
health:
  type: http
  path: /health
  port: 8080
discovery:
  service_slug: vehicle-config-service
  category: configuration
  api_base_path: /vehicle-configs
  capability_tags:
    - vehicle-configs
    - validation
  health_endpoint: /health
  visibility: internal
  depends_on: []
