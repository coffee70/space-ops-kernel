unit_id: document-knowledge-service
display_name: Document Knowledge Service
package_owner: space-ops-platform
runtime_kind: service
runtime_template: python-service
source_path: project/space-ops-platform
build:
  command: pip install -r requirements.txt
run:
  command: sh -c "cd /app/platform/backend && uvicorn main:app --app-dir services/document-knowledge-service --host 0.0.0.0 --port 8080"
health:
  type: http
  path: /health
  port: 8080
discovery:
  service_slug: document-knowledge-service
  category: intelligence
  api_base_path: /intelligence/documents
  capability_tags:
    - documents
    - ingestion
    - embeddings
  health_endpoint: /health
  visibility: internal
