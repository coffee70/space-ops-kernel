unit_id: simulator-control-service
display_name: Simulator Control Service
package_owner: space-ops-platform
runtime_kind: service
runtime_template: python-service
source_path: project/space-ops-platform
build:
  command: pip install -r requirements.txt
run:
  command: sh -c "cd /app/platform/backend && uvicorn main:app --app-dir services/simulator-control-service --host 0.0.0.0 --port 8080"
health:
  type: http
  path: /health
  port: 8080
discovery:
  service_slug: simulator-control-service
  category: simulator
  api_base_path: /simulator
  capability_tags:
    - simulator
    - runtime-control
  health_endpoint: /health
  visibility: internal
  depends_on:
    - source-registry-service
    - position-orbit-service
