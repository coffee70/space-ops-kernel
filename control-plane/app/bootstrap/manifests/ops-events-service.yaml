unit_id: ops-events-service
display_name: Ops Events Service
package_owner: space-ops-platform
runtime_kind: service
runtime_template: python-service
source_path: project/space-ops-platform
build:
  command: pip install -r requirements.txt
run:
  command: sh -c "cd /app/platform/backend && uvicorn main:app --app-dir services/ops-events-service --host 0.0.0.0 --port 8080"
health:
  type: http
  path: /health
  port: 8080
discovery:
  service_slug: ops-events-service
  category: operations
  api_base_path: /ops/events
  capability_tags:
    - ops
    - timeline
  health_endpoint: /health
  visibility: internal
  depends_on:
    - telemetry-ingest-service
