unit_id: tool-execution-service
display_name: Tool Execution Service
package_owner: space-ops-platform
runtime_kind: service
runtime_template: python-service
source_path: project/space-ops-platform
build:
  command: pip install -r requirements.txt
run:
  command: sh -c "cd /app/platform/backend && uvicorn main:app --app-dir services/tool-execution-service --host 0.0.0.0 --port 8080"
health:
  type: http
  path: /health
  port: 8080
discovery:
  service_slug: tool-execution-service
  category: intelligence
  api_base_path: /intelligence/tools/execute
  capability_tags:
    - tool-execution
    - guardrails
  health_endpoint: /health
  visibility: internal
  depends_on:
    - tool-registry-service
