unit_id: context-retrieval-service
display_name: Context Retrieval Service
package_owner: space-ops-platform
runtime_kind: service
runtime_template: python-service
source_path: project/space-ops-platform
build:
  command: pip install -r requirements.txt
run:
  command: sh -c "cd /app/platform/backend && uvicorn main:app --app-dir services/context-retrieval-service
    --host 0.0.0.0 --port 8080"
health:
  type: http
  path: /health
  port: 8080
dependencies:
  - document-knowledge-service
  - code-intelligence-service
  - tool-registry-service
discovery:
  service_slug: context-retrieval-service
  category: intelligence
  api_base_path: /intelligence/context
  capability_tags:
    - retrieval
    - rag
    - context
  health_endpoint: /health
  visibility: internal
