unit_id: code-intelligence-service
display_name: Code Intelligence Service
package_owner: space-ops-platform
runtime_kind: service
runtime_template: python-service
source_path: project/space-ops-platform
build:
  command: pip install -r requirements.txt
run:
  command: sh -c "cd /app/platform/backend && uvicorn main:app --app-dir services/code-intelligence-service
    --host 0.0.0.0 --port 8080"
health:
  type: http
  path: /health
  port: 8080
dependencies: []
discovery:
  service_slug: code-intelligence-service
  category: intelligence
  api_base_path: /intelligence/code
  capability_tags:
    - code-search
    - indexing
    - source-read
  health_endpoint: /health
  visibility: internal
