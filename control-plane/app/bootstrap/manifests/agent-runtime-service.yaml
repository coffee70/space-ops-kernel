unit_id: agent-runtime-service
display_name: Agent Runtime Service
package_owner: space-ops-apps
runtime_kind: service
runtime_template: node-service
source_path: project/space-ops-apps
build:
  command: sh -c "cd services/agent-runtime-service && npm install"
run:
  command: sh -c "cd /app/platform/services/agent-runtime-service && node server.js"
health:
  type: http
  path: /health
  port: 8080
discovery:
  service_slug: agent-runtime-service
  category: intelligence
  api_base_path: /intelligence/agent
  capability_tags:
    - reasoning
    - orchestration
    - chat
  health_endpoint: /health
  visibility: internal
  depends_on:
    - context-retrieval-service
    - tool-registry-service
    - tool-execution-service
