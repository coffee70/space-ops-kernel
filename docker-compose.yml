services:
  postgres:
    image: timescale/timescaledb:2.25.1-pg16
    container_name: telemetry-postgres
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.11-alpine
    container_name: telemetry-nats
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4222"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform-api:
    build:
      context: ..
      dockerfile: space-ops-platform/Dockerfile
    container_name: telemetry-platform-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://telemetry:telemetry@postgres:5432/telemetry_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      VEHICLE_CONFIG_ROOT: /app/platform/backend/resources/vehicle-configurations
      CONTROL_PLANE_URL: http://control-plane:8100
      KERNEL_SERVICE_PROXY_READ_TIMEOUT: "900"
      NATS_URL: nats://nats:4222
      CORS_ORIGIN_REGEX: "^http://[^/]+:(3000|8080)$"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    container_name: telemetry-control-plane
    ports:
      - "8100:8100"
    environment:
      DATABASE_URL: postgresql://telemetry:telemetry@postgres:5432/control_plane_db
      RUNTIME_ROOT: /app/kernel/runtime
      PLATFORM_SOURCE_ROOT: /imports/space-ops-platform
      APPS_SOURCE_ROOT: /imports/space-ops-apps
      COMPOSE_FILE: /app/kernel/docker-compose.yml
      COMPOSE_PROJECT_NAME: space-ops-kernel
      RUNTIME_STRATEGY: docker
      RUNTIME_PROXY_READ_TIMEOUT_SECONDS: 900
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,http://platform-edge-proxy:8080
      PLATFORM_DATABASE_URL: postgresql://telemetry:telemetry@postgres:5432/telemetry_db
      PLATFORM_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PLATFORM_OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      PLATFORM_API_BASE_URL: http://platform-api:8000
      PLATFORM_CONTROL_PLANE_URL: http://control-plane:8100
      PLATFORM_NATS_URL: nats://nats:4222
      PLATFORM_VEHICLE_CONFIG_ROOT: /app/platform/backend/resources/vehicle-configurations
      PLATFORM_SATNOGS_API_TOKEN: ${SATNOGS_API_TOKEN:-}
      PLATFORM_SATNOGS_LIVE_ENABLED: ${SATNOGS_LIVE_ENABLED:-false}
      PLATFORM_SATNOGS_ADAPTER_CONFIG: app/adapters/satnogs/config.example.yaml
      PLATFORM_SATNOGS_DLQ_ROOT: /app/runtime/satnogs-adapter/dlq
    volumes:
      - ./:/app/kernel
      - ../space-ops-platform:/imports/space-ops-platform:ro
      - ../space-ops-apps:/imports/space-ops-apps:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2).read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 90
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  mission-control-ui:
    build:
      context: ../space-ops-apps/mission-control-ui
      dockerfile: Dockerfile
      args:
        # Official path: use Layer 1 edge proxy (same-origin relative API routes). Raw :3000 is UI/debug only.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_CONTROL_PLANE_URL: ${NEXT_PUBLIC_CONTROL_PLANE_URL:-http://localhost:8100}
    container_name: telemetry-mission-control-ui
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_CONTROL_PLANE_URL: ${NEXT_PUBLIC_CONTROL_PLANE_URL:-http://localhost:8100}
      API_SERVER_URL: http://platform-api:8000
      CONTROL_PLANE_SERVER_URL: http://control-plane:8100
    depends_on:
      platform-api:
        condition: service_healthy
      control-plane:
        condition: service_healthy

  platform-edge-proxy:
    build:
      context: ./platform-edge-proxy
      dockerfile: Dockerfile
    container_name: telemetry-platform-edge-proxy
    ports:
      - "8080:8080"
    depends_on:
      mission-control-ui:
        condition: service_started
      platform-api:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
