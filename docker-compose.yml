services:
  postgres:
    image: timescale/timescaledb:2.25.1-pg16
    container_name: telemetry-postgres
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  platform-api:
    build:
      context: ../space-ops-platform
      dockerfile: backend/Dockerfile
    container_name: telemetry-platform-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://telemetry:telemetry@postgres:5432/telemetry_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      VEHICLE_CONFIG_ROOT: /app/vehicle-configurations
      CORS_ORIGIN_REGEX: "^http://[^/]+:3000$"
    volumes:
      - ../space-ops-apps/vehicle-configurations:/app/vehicle-configurations:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  mission-control-ui:
    build:
      context: ../space-ops-apps/mission-control-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: telemetry-mission-control-ui
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_SERVER_URL: http://platform-api:8000
    depends_on:
      platform-api:
        condition: service_healthy

  simulator:
    build:
      context: ../space-ops-apps/simulator
      dockerfile: Dockerfile
    container_name: telemetry-simulator
    ports:
      - "8001:8001"
    environment:
      BACKEND_URL: http://platform-api:8000
      VEHICLE_CONFIG_ROOT: /app/vehicle-configurations
      VEHICLE_CONFIG_PATH: simulators/drogonsat.yaml
    volumes:
      - ../space-ops-apps/telemetry_catalog:/app/telemetry_catalog:ro
      - ../space-ops-apps/vehicle-configurations:/app/vehicle-configurations:ro
    depends_on:
      platform-api:
        condition: service_healthy

  simulator2:
    build:
      context: ../space-ops-apps/simulator
      dockerfile: Dockerfile
    container_name: telemetry-simulator-2
    ports:
      - "8002:8001"
    environment:
      BACKEND_URL: http://platform-api:8000
      VEHICLE_CONFIG_ROOT: /app/vehicle-configurations
      VEHICLE_CONFIG_PATH: simulators/rhaegalsat.json
    volumes:
      - ../space-ops-apps/telemetry_catalog:/app/telemetry_catalog:ro
      - ../space-ops-apps/vehicle-configurations:/app/vehicle-configurations:ro
    depends_on:
      platform-api:
        condition: service_healthy

  satnogs-adapter:
    build:
      context: ../space-ops-apps/satnogs_adapter
      dockerfile: Dockerfile
    container_name: telemetry-satnogs-adapter
    environment:
      SATNOGS_API_TOKEN: ${SATNOGS_API_TOKEN:-}
      VEHICLE_CONFIG_ROOT: /app/vehicle-configurations
    volumes:
      - ../space-ops-apps/telemetry_catalog:/app/telemetry_catalog:ro
      - ../space-ops-apps/vehicle-configurations:/app/vehicle-configurations:ro
    depends_on:
      platform-api:
        condition: service_healthy

volumes:
  postgres_data:
